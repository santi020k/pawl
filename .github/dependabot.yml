version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "skip-changelog"
    ignore:
      # Biome and Oxlint are pinned exactly: pawl reads Biome's experimental JSON reporter, and
      # every Oxlint upgrade needs `pnpm --filter @santi020k/pawl run oxlint-rules`. Upgrade them by hand.
      - dependency-name: "@biomejs/biome"
      - dependency-name: "oxlint"
    groups:
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: "UTC"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "type: ci"
      - "skip-changelog"
    groups:
      actions:
        patterns:
          - "*"
