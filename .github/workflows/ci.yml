name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Required checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ff490e9efbd5fdfbdb1e6c404f1741d04c57f585 # v2.0.0
        with:
          node-version: ${{ matrix.node }}
          task-cache-path: .turbo/cache
          task-cache-key: node-${{ matrix.node }}

      - name: Require a changeset
        if: >-
          matrix.node == 22 &&
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'skip-changelog') &&
          !startsWith(github.head_ref, 'changeset-release/')
        run: pnpm changeset status --since=origin/main

      # Build, typecheck, test, pawl on its own code, spelling, unused code, generated files.
      - name: Validate repository
        run: pnpm ok

      - name: Diagnose the docs site with Astro Doctor
        if: matrix.node == 22
        run: pnpm --filter @santi020k/pawl-docs run doctor

      - name: Install the packed package like a consumer
        run: pnpm run check:packed-install
