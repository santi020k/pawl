name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      # The rules page is generated from the library's rule catalog, and the changelog page reads the
      # packages' changelogs and the pending changesets.
      - "packages/pawl/**"
      - "packages/pawl-policy/CHANGELOG.md"
      - ".changeset/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: docs-production
  cancel-in-progress: false

jobs:
  # A push that brings a new version is also a release: release.yml creates the tag, which the
  # changelog page reads, and then starts this workflow itself. Deploying on the push too would build
  # the site twice, the first time without the tag.
  plan:
    name: Plan the deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Leave a new version to the release
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          deploy=true
          # Only when everything is known: this push changed the version, and the version has no tag
          # yet. Anything that cannot be read deploys, as before.
          if [ "$EVENT_NAME" = "push" ]; then
            version=$(jq -r .version packages/pawl/package.json)
            if git fetch --no-tags --quiet --depth=1 origin "$BEFORE" &&
              manifest=$(git show "${BEFORE}:packages/pawl/package.json") &&
              previous=$(printf '%s' "$manifest" | jq -er .version) &&
              tags=$(git ls-remote origin "refs/tags/v${version}"); then
              if [ -n "$previous" ] && [ "$previous" != "$version" ] && [ -z "$tags" ]; then
                deploy=false
                echo "::notice::This push brings v${version}, which has no tag yet. The Release workflow deploys the docs once it has created it."
              fi
            fi
          fi
          echo "deploy=${deploy}" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    name: Build & Deploy to Cloudflare Pages
    needs: plan
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: docs-production
      url: https://pawl.santi020k.com
    steps:
      - name: Check Doppler deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=false
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing ${name}. Check the Doppler pawl/prd sync to GitHub environment docs-production."
              missing=true
            fi
          done
          if [ "$missing" = true ]; then
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          # Starlight reads each page's "Last updated" date from the Git history.
          fetch-depth: 0

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@b456ccc07a80cac227cc314be16c8309557ea8e6 # v2.1.0
        with:
          node-version-file: .nvmrc

      - name: Build docs
        run: pnpm --filter @santi020k/pawl-docs run build

      - name: Audit SEO and social metadata
        run: pnpm --filter @santi020k/pawl-docs run audit

      # The first run creates the Direct Upload project; every later run finds it.
      - name: Create the Pages project if it is missing
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if pnpm exec wrangler pages project list --json |
            node -e 'const projects = JSON.parse(require("node:fs").readFileSync(0, "utf8")); process.exit(projects.some(project => project["Project Name"] === "pawl-docs") ? 0 : 1)'; then
            echo "The Pages project pawl-docs exists."
          else
            pnpm exec wrangler pages project create pawl-docs --production-branch=main
          fi

      - name: Deploy to Cloudflare Pages
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm exec wrangler pages deploy dist
          --project-name=pawl-docs
          --branch=main
          --commit-hash=${{ github.sha }}
