name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      # The rules page is generated from the library's rule catalog.
      - "packages/pawl/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: docs-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: docs-production
      url: https://pawl.santi020k.com
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          # Starlight reads each page's "Last updated" date from the Git history.
          fetch-depth: 0

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@b456ccc07a80cac227cc314be16c8309557ea8e6 # v2.1.0
        with:
          node-version-file: .nvmrc

      - name: Build docs
        run: pnpm --filter @santi020k/pawl-docs run build

      - name: Audit SEO and social metadata
        run: pnpm --filter @santi020k/pawl-docs run audit

      - name: Deploy to Cloudflare Pages
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm exec wrangler pages deploy dist
          --project-name=pawl-docs
          --branch=main
          --commit-hash=${{ github.sha }}
