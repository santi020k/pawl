name: Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - ".changeset/**"
      - "packages/pawl/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    name: Create release pull request or publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm
      url: https://www.npmjs.com/package/@santi020k/pawl
    permissions:
      contents: write
      id-token: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@b456ccc07a80cac227cc314be16c8309557ea8e6 # v2.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # npm trusted publishing (OIDC) needs a recent npm; no NPM_TOKEN is stored.
      - name: Install npm with trusted publishing support
        run: |
          npm install --global npm@12.1.0
          test "$(npm --version)" = "12.1.0"

      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.CHANGESETS_TOKEN || github.token }}
          version-script: pnpm run version-packages
          publish-script: pnpm run release
          commit-message: "chore(release): version package"
          pr-title: "chore(release): version package"
          create-github-releases: true
          push-with-git-cli: true
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: Verify the published package
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION=$(node -p "require('./packages/pawl/package.json').version")
          PUBLISHED=$(npm view "@santi020k/pawl@${VERSION}" version)
          test "$PUBLISHED" = "$VERSION"
          test "$(npx --yes "@santi020k/pawl@${VERSION}" --version)" = "${VERSION}"

      - name: Create repository version tag
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION=$(node -p "require('./packages/pawl/package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists; skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}" "$GITHUB_SHA"
          git push origin "v${VERSION}"
