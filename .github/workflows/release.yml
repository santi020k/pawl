name: Release

# A release is prepared on a release/v<version> branch and merged into main through a pull request.
# This workflow then publishes the versions npm does not have yet, checks them and creates the
# v<version> tag and GitHub release on the merged commit. It does nothing when main holds no new
# version, and it is safe to run again after a failure.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "packages/pawl/**"
      - "packages/pawl-policy/**"
      - "scripts/release.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

# Publishing and tagging must finish as one run.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    name: Publish and tag
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: npm
      url: https://www.npmjs.com/package/@santi020k/pawl
    permissions:
      # To start the docs deploy once the release exists.
      actions: write
      # To read the checks that passed on the release pull request.
      checks: read
      contents: write
      pull-requests: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@b456ccc07a80cac227cc314be16c8309557ea8e6 # v2.1.0
        with:
          node-version: 22

      # npm trusted publishing (OIDC) needs a recent npm; no NPM_TOKEN is stored.
      - name: Install npm with trusted publishing support
        run: |
          npm install --global npm@12.1.0
          test "$(npm --version)" = "12.1.0"

      - name: Plan the release
        id: plan
        run: |
          node scripts/release.ts plan >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      # CI ran the gate on the release pull request. It is not run again when that result is proven
      # to be about the files of this commit: the commit is the merge of a pull request whose head has
      # the same tree and already held everything on main, and every required check passed on that
      # head. Anything short of that, or any failure to find it out, runs the gate here.
      - name: Find the checks that passed on these files
        id: trusted
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # The jobs of ci.yml, by the names GitHub reports them under.
          REQUIRED_CHECKS: |-
            Required checks (Node 22)
            Required checks (Node 24)
            Language tools (macOS)
        run: |
          passed_on_pull_request() {
            local found number head name conclusions

            found=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq \
              "[.[] | select(.merged_at != null and .base.ref == \"main\" and .merge_commit_sha == \"${GITHUB_SHA}\")][0] | select(. != null) | \"\(.number) \(.head.sha)\"") ||
              { echo "The pull request of ${GITHUB_SHA} could not be looked up."; return 1; }
            [ -n "$found" ] || { echo "No merged pull request has ${GITHUB_SHA} as its merge commit."; return 1; }
            number=${found%% *}
            head=${found##* }

            git fetch --no-tags --quiet origin "refs/pull/${number}/head" ||
              { echo "The head of pull request #${number} could not be fetched."; return 1; }
            [ "$(git rev-parse FETCH_HEAD)" = "$head" ] ||
              { echo "The head of pull request #${number} is no longer ${head}."; return 1; }
            [ "$(git rev-parse "${GITHUB_SHA}^{tree}")" = "$(git rev-parse "${head}^{tree}")" ] ||
              { echo "The files of ${GITHUB_SHA} differ from those of ${head}, the head of pull request #${number}."; return 1; }
            # CI checked the head merged into main as it was then. That is the head's own tree only
            # when the head already held everything on main.
            git merge-base --is-ancestor "${GITHUB_SHA}^1" "$head" ||
              { echo "Pull request #${number} was merged without all of main in it."; return 1; }

            while IFS= read -r name; do
              [ -n "$name" ] || continue
              # 15368 is GitHub Actions, so a check another app reports under the same name does not count.
              # A run that a newer one cancelled says nothing; a failed, skipped or unfinished one refuses.
              conclusions=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/commits/${head}/check-runs" \
                -f check_name="$name" -f filter=latest -F app_id=15368 --jq '[.check_runs[].conclusion] | if any(. == "success") and all(. == "success" or . == "cancelled") then "success" else join(",") end') ||
                { echo "The check \"${name}\" could not be looked up on ${head}."; return 1; }
              [ "$conclusions" = "success" ] ||
                { echo "The check \"${name}\" on ${head} is \"${conclusions:-missing}\", not a success."; return 1; }
            done <<< "$REQUIRED_CHECKS"

            echo "Every required check passed on ${head}, the head of pull request #${number}, which has the files of ${GITHUB_SHA}."
          }

          if reason=$(passed_on_pull_request); then
            echo "validated=true" >> "$GITHUB_OUTPUT"
            echo "${reason} The gate is not run again."
          else
            echo "validated=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${reason} The gate runs here."
          fi

      - name: Validate repository
        if: steps.plan.outputs.publish == 'true' && steps.trusted.outputs.validated != 'true'
        run: pnpm ok

      - name: Install the packed package like a consumer
        if: steps.plan.outputs.publish == 'true' && steps.trusted.outputs.validated != 'true'
        run: pnpm run check:packed-install

      - name: Publish to npm with provenance
        if: steps.plan.outputs.publish == 'true'
        run: pnpm run release

      # Only a 404 means the release is missing; any other failure stops the run.
      - name: Find the GitHub release
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          if FOUND=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}" --jq .tag_name 2>&1); then
            echo "released=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$FOUND" | grep -q "HTTP 404"; then
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not look up the release v${VERSION}: ${FOUND}"
            exit 1
          fi

      - name: Verify the published packages
        if: steps.plan.outputs.publish == 'true' || steps.find.outputs.released == 'false'
        run: node scripts/release.ts verify

      - name: Create the tag and GitHub release
        if: steps.find.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          TAG="v${VERSION}"
          # A published tag never moves: refuse one that points at another commit. The last line is
          # the commit of an annotated tag.
          REFS=$(git ls-remote origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}")
          TAGGED=$(printf '%s\n' "$REFS" | tail -n 1 | cut -f1)
          if [ -n "$TAGGED" ] && [ "$TAGGED" != "$GITHUB_SHA" ]; then
            echo "::error::The tag ${TAG} points at ${TAGGED}, not at ${GITHUB_SHA}. Release a new version instead."
            exit 1
          fi
          node scripts/release.ts notes "${RUNNER_TEMP}/release-notes.md"
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file "${RUNNER_TEMP}/release-notes.md" $PRERELEASE

      # The changelog page dates each version by its tag, which exists only now. deploy-docs.yml left
      # the push that brought this version to this run, so the site is built once, here. A run that is
      # started again deploys again: the first one may have created the release and then failed here.
      - name: Deploy the docs
        if: steps.find.outputs.released == 'false' || github.run_attempt > 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-docs.yml --ref main
